<title>The Great Haze</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Spectral:ital,wght@0,400;0,600;1,400&family=Special+Elite&display=swap">
<style>
/* Layout: the 3D road fills the screen; a thin HUD rides the top edge, the party
   rests at the left, and each decision arrives as a card on the right (a bottom
   sheet on phones). During cinematics everything but the caption steps aside.
   A single dark look, chosen on purpose: this is a night world. */
:root {
  color-scheme: dark;
  --night: #06080d;
  --ink: rgba(8, 10, 16, 0.86);
  --ink-solid: #0b0e16;
  --raise: rgba(235, 226, 209, 0.055);
  --paper: #ebe2d1;
  --paper-dim: #aaa293;
  --paper-faint: #736d63;
  --blood: #c1242f;
  --oxblood: #5a0e17;
  --ember: #f4a04d;
  --reach: #8fc6e4;
  --good: #86c496;
  --warn: #e3b24c;
  --bad: #e5574f;
  --line: rgba(235, 226, 209, 0.14);
  --line-strong: rgba(235, 226, 209, 0.3);
  --f-display: "IM Fell English SC", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --f-body: "Spectral", "Iowan Old Style", Georgia, serif;
  --f-type: "Special Elite", "American Typewriter", "Courier New", monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--night); color: var(--paper); overflow: hidden; }
body { font-family: var(--f-body); font-size: 16px; line-height: 1.55; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#ui { position: fixed; inset: 0; pointer-events: none; padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
/* :where keeps this at zero specificity so a layer's own pointer-events: none still wins. */
:where(#ui) > * { pointer-events: auto; }

/* ---- HUD ---- */
.hud { position: absolute; left: 0; right: 0; top: 0; display: grid; grid-template-columns: auto minmax(220px, 1fr) auto auto; gap: 18px; align-items: center; padding: 10px 18px 22px; background: linear-gradient(180deg, rgba(4, 5, 9, 0.88) 0%, rgba(4, 5, 9, 0.6) 60%, transparent 100%); transition: opacity 0.4s, top 0.6s ease; }
.hud:empty { display: none; }
.where .day { font-family: var(--f-display); font-size: 22px; line-height: 1; letter-spacing: 0.06em; }
.where .region { font-family: var(--f-type); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--paper-dim); margin-top: 4px; white-space: nowrap; }
.gauge { min-width: 0; }
.gauge-head { display: flex; gap: 10px; align-items: baseline; font-family: var(--f-type); font-size: 12px; color: var(--paper-dim); white-space: nowrap; overflow: hidden; }
.gauge-head .gap { color: var(--paper); }
.zone { padding: 0 6px; border: 1px solid currentColor; border-radius: 2px; font-size: 10.5px; letter-spacing: 0.14em; }
.zone-far { color: var(--reach); } .zone-near { color: var(--warn); } .zone-close { color: var(--ember); } .zone-upon { color: var(--bad); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.45; } }
.track { position: relative; height: 18px; margin-top: 3px; }
.track .line { position: absolute; left: 0; right: 0; top: 9px; height: 1px; background: var(--line-strong); }
.track .band { position: absolute; left: 0; top: 4px; height: 11px; background: linear-gradient(90deg, var(--oxblood), var(--blood) 85%, rgba(193, 36, 47, 0)); box-shadow: 0 0 14px rgba(193, 36, 47, 0.6); border-radius: 2px; transition: width 1s; }
.track .mark { position: absolute; top: 5px; width: 1px; height: 9px; background: var(--line-strong); }
.track .mark.passed { background: var(--paper-dim); }
.track .mark.reach { background: var(--reach); width: 2px; height: 13px; top: 3px; }
.track .wagon { position: absolute; top: -1px; margin-left: -9px; color: var(--paper); transition: left 1s; }
.track .wagon svg { width: 18px; height: 18px; }
.gauge-foot { font-family: var(--f-type); font-size: 10.5px; color: var(--paper-faint); }
.res { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 7px; border: 1px solid var(--line); border-radius: 2px; background: rgba(0, 0, 0, 0.35); font-family: var(--f-type); font-size: 13px; font-variant-numeric: tabular-nums; }
.chip .ico { display: inline-flex; color: var(--paper-dim); }
.chip.low { border-color: var(--warn); } .chip.low b { color: var(--warn); }
.chip.crit { border-color: var(--bad); } .chip.crit b { color: var(--bad); }
.chip b { font-weight: 400; }
.tools { display: flex; gap: 4px; }
.tool { display: inline-flex; align-items: center; justify-content: center; min-width: 30px; height: 28px; padding: 0 6px; background: rgba(0, 0, 0, 0.35); border: 1px solid var(--line); border-radius: 2px; color: var(--paper-dim); }
.tool:hover { color: var(--paper); border-color: var(--ember); }
.tool.text { font-family: var(--f-type); font-size: 11px; letter-spacing: 0.05em; }

/* ---- party ---- */
.party { position: absolute; left: 14px; bottom: 14px; width: 232px; max-height: calc(100% - 120px); overflow: auto; display: grid; gap: 5px; align-content: end; transition: opacity 0.4s, transform 0.4s; scrollbar-width: thin; }
.party:empty { display: none; }
.party-head { font-family: var(--f-type); font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--paper-faint); padding-left: 2px; }
.member { text-align: left; padding: 7px 9px 8px; background: var(--ink); border: 1px solid var(--line); border-radius: 3px; backdrop-filter: blur(4px); min-width: 0; }
.member:hover { border-color: var(--ember); }
.member.bad { border-color: rgba(229, 87, 79, 0.6); }
.m-name { font-family: var(--f-display); font-size: 16px; line-height: 1.15; letter-spacing: 0.02em; }
.m-meta { font-family: var(--f-type); font-size: 10px; color: var(--paper-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
.m-bar { display: grid; grid-template-columns: 36px minmax(0, 1fr) 22px; gap: 6px; align-items: center; font-family: var(--f-type); font-size: 10px; color: var(--paper-dim); }
.m-bar .tr { height: 4px; background: rgba(235, 226, 209, 0.12); border-radius: 1px; overflow: hidden; }
.m-bar i { display: block; height: 100%; }
.m-bar.good i { background: var(--good); } .m-bar.calm i { background: var(--reach); } .m-bar.warn i { background: var(--warn); } .m-bar.bad i { background: var(--bad); }
.m-bar .n { text-align: right; font-variant-numeric: tabular-nums; }
.m-cond { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 5px; }
.m-cond span { font-family: var(--f-type); font-size: 9.5px; padding: 0 5px; border: 1px solid currentColor; border-radius: 2px; }
.m-cond .bad { color: var(--bad); } .m-cond .haze { color: #ff7a82; } .m-cond .warn { color: var(--warn); }

/* ---- card ---- */
.card { position: absolute; right: 16px; bottom: 16px; width: min(440px, calc(100% - 290px)); max-height: calc(100% - 118px); overflow: auto; padding: 20px 22px 18px; background: var(--ink); border: 1px solid var(--line); border-radius: 4px; backdrop-filter: blur(6px); box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55); transition: opacity 0.35s, transform 0.35s; scrollbar-width: thin; }
.card:empty { display: none; }
.card.kind-store { width: min(560px, calc(100% - 290px)); }
.card.kind-setup { width: min(620px, calc(100% - 60px)); }
.card.kind-ending { width: min(560px, calc(100% - 290px)); }
.kicker { font-family: var(--f-type); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--paper-faint); margin: 0 0 4px; }
.card h2 { font-family: var(--f-display); font-weight: 400; font-size: 30px; line-height: 1.1; letter-spacing: 0.02em; margin: 0 0 12px; text-wrap: balance; }
.lines { display: grid; gap: 8px; }
.lines p { margin: 0; }
.lines p.quote { font-style: italic; }
.talk { margin-top: 10px; display: grid; gap: 6px; }
.talk p { margin: 0; padding-left: 12px; border-left: 2px solid var(--line-strong); }
.talk .who { font-family: var(--f-type); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--paper-faint); margin-right: 8px; }
.talk p.stranger .who { color: var(--ember); }
.talk p.npc .who { color: #d8c48a; }
.roll { margin-top: 10px; font-family: var(--f-type); font-size: 12.5px; color: var(--paper-faint); }
.roll b { color: #c9a35a; font-weight: 400; }
.roll.fail b { color: var(--ember); }
.notice { margin-top: 12px; padding: 2px 0 2px 14px; border-left: 2px solid var(--ember); display: grid; gap: 5px; }
.notice .lab { font-family: var(--f-type); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ember); }
.notice p { margin: 0; font-style: italic; color: #f3dcc0; }
.ledger { margin-top: 12px; padding: 8px 12px; background: rgba(235, 226, 209, 0.04); border: 1px dashed var(--line-strong); font-family: var(--f-type); font-size: 13px; line-height: 1.6; display: grid; }
.ledger .t { color: var(--ember); } .ledger .g { color: var(--good); } .ledger .b { color: var(--bad); } .ledger .n { color: var(--paper-dim); }
.threat { font-family: var(--f-type); font-size: 14px; color: var(--bad); margin-top: 8px; }
.opts { display: grid; gap: 6px; margin-top: 16px; }
.opt { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; width: 100%; text-align: left; padding: 10px 12px; background: var(--raise); border: 1px solid var(--line); border-radius: 3px; transition: background 0.15s, border-color 0.15s; }
.opt:hover:not(:disabled) { background: rgba(244, 160, 77, 0.1); border-color: var(--ember); }
.opt .n { font-family: var(--f-type); font-size: 12px; color: var(--paper-faint); }
.opt .lab { font-weight: 600; line-height: 1.3; }
.opt .hint { display: block; font-size: 14px; color: var(--paper-dim); line-height: 1.4; margin-top: 2px; }
.opt .cost { font-family: var(--f-type); font-size: 12px; color: var(--ember); text-align: right; white-space: nowrap; }
.opt .cost em { display: block; font-style: normal; font-size: 10.5px; color: var(--paper-faint); }
.opt:disabled { opacity: 0.45; cursor: not-allowed; }
.opt.look { border-style: dashed; border-color: rgba(244, 160, 77, 0.55); }
.opt.primary { background: var(--blood); border-color: #e0525c; }
.opt.primary:hover:not(:disabled) { background: #d22e3a; border-color: #ff8a92; }
.opt.primary .hint, .opt.primary .n, .opt.primary .cost, .opt.primary .cost em { color: #fbe1c8; }
.group { margin-top: 12px; }
.glab { display: block; font-family: var(--f-type); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--paper-faint); margin: 12px 0 5px; }
.group .glab { margin-top: 0; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); border: 1px solid var(--line-strong); border-radius: 3px; overflow: hidden; }
.seg button { background: var(--raise); border: 0; border-right: 1px solid var(--line); padding: 7px 7px; text-align: left; min-width: 0; }
.seg button:last-child { border-right: 0; }
.seg button:hover { background: rgba(244, 160, 77, 0.12); }
.seg button.on { background: var(--paper); color: #16120d; }
.seg .sn { display: block; font-weight: 600; font-size: 14px; line-height: 1.2; }
.seg .sd { display: block; font-family: var(--f-type); font-size: 10.5px; opacity: 0.75; }
.seg-hint { font-size: 13.5px; color: var(--paper-dim); margin: 4px 0 0; }
.acts { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 6px; }
.acts .opt { grid-template-columns: minmax(0, 1fr) auto; padding: 8px 10px; }
.acts .opt .n { display: none; }
.acts .opt .lab { font-size: 14.5px; }
.acts .opt .hint { font-size: 12.5px; }
.shop-wrap { overflow-x: auto; margin-top: 10px; }
.shop { width: 100%; border-collapse: collapse; font-size: 14px; }
.shop th { font-family: var(--f-type); font-weight: 400; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--paper-faint); text-align: right; padding: 3px 6px; border-bottom: 1px solid var(--line-strong); }
.shop th:first-child { text-align: left; }
.shop td { padding: 7px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
.shop td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.shop .item { display: inline-flex; gap: 6px; align-items: center; font-weight: 600; }
.shop .item .ico { color: var(--paper-dim); display: inline-flex; }
.shop .blurb { display: block; font-size: 12.5px; color: var(--paper-dim); line-height: 1.35; max-width: 30ch; }
.shop td.step { white-space: nowrap; text-align: right; }
.shop td.step button { min-width: 32px; padding: 3px 5px; margin-left: 2px; background: var(--raise); border: 1px solid var(--line-strong); border-radius: 2px; font-family: var(--f-type); font-size: 11.5px; }
.shop td.step button:hover:not(:disabled) { border-color: var(--ember); }
.shop td.step button:disabled { opacity: 0.3; cursor: not-allowed; }
.shop-foot { margin-top: 10px; font-family: var(--f-type); font-size: 12.5px; color: var(--paper-dim); }
.picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 6px; margin-top: 12px; }
.pick { text-align: left; padding: 10px 12px; background: var(--raise); border: 1px solid var(--line); border-radius: 3px; display: grid; gap: 3px; }
.pick:hover:not(:disabled) { border-color: var(--ember); }
.pick.on { border-color: var(--paper); background: rgba(235, 226, 209, 0.12); }
.pick:disabled { opacity: 0.4; cursor: not-allowed; }
.pick .pn { font-family: var(--f-display); font-size: 18px; }
.pick .pm { font-family: var(--f-type); font-size: 11px; color: var(--ember); }
.pick .pb { font-size: 13.5px; color: var(--paper-dim); line-height: 1.4; }
.count { font-family: var(--f-type); font-size: 12.5px; color: var(--paper-dim); margin: 10px 0 0; }
.epi { display: grid; gap: 7px; }
.epi p { margin: 0; }
.epi .fate { font-family: var(--f-type); font-size: 13px; color: var(--paper-dim); }
.epi .sp { height: 4px; }
.score { font-family: var(--f-display); font-size: 28px; margin-top: 12px; }
.score small { font-family: var(--f-type); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--paper-faint); margin-right: 10px; }

/* ---- cinematic mode ---- */
.cine { position: absolute; inset: 0; pointer-events: none; }
.cine .bar { position: absolute; left: 0; right: 0; height: 0; background: #000; transition: height 0.6s ease; }
.cine .top { top: 0; } .cine .bottom { bottom: 0; }
.cine .skip { position: absolute; right: 18px; bottom: 16px; pointer-events: auto; opacity: 0; transform: translateY(8px); transition: opacity 0.4s 0.3s, transform 0.4s 0.3s; background: rgba(0, 0, 0, 0.4); border: 1px solid var(--line-strong); border-radius: 2px; padding: 5px 12px; font-family: var(--f-type); font-size: 12px; letter-spacing: 0.08em; color: var(--paper-dim); }
.cine .skip:hover { color: var(--paper); border-color: var(--ember); }
.is-busy .cine .bar { height: 7vh; }
.is-busy .cine .skip { opacity: 1; transform: none; }
.is-busy .card, .is-busy .party { opacity: 0; transform: translateY(14px); pointer-events: none; }
/* The HUD rides below the letterbox bar instead of being cut by it. */
.is-busy .hud { opacity: 0.55; top: 7vh; }
.is-busy .tool.abandon { opacity: 0.35; pointer-events: none; }
.cine { visibility: hidden; }
.is-busy .cine { visibility: visible; }
.caption { position: absolute; left: 50%; bottom: 13vh; transform: translate(-50%, 8px); width: min(760px, calc(100% - 32px)); text-align: center; opacity: 0; transition: opacity 0.6s, transform 0.6s; pointer-events: none; text-shadow: 0 2px 18px rgba(0, 0, 0, 0.9); }
.caption.on { opacity: 1; transform: translate(-50%, 0); }
.cap-main { font-family: var(--f-display); font-size: clamp(24px, 3.4vw, 40px); letter-spacing: 0.04em; line-height: 1.15; }
.cap-sub { font-family: var(--f-type); font-size: 13px; letter-spacing: 0.08em; color: var(--paper-dim); margin-top: 6px; }

.toast { position: absolute; left: 50%; top: 92px; transform: translate(-50%, -6px); opacity: 0; padding: 6px 14px; background: var(--ink); border: 1px solid var(--line-strong); border-radius: 2px; font-family: var(--f-type); font-size: 13px; color: var(--ember); pointer-events: none; }
.toast.on { animation: toast 2.8s ease forwards; }
@keyframes toast { 10% { opacity: 1; transform: translate(-50%, 0); } 80% { opacity: 1; } 100% { opacity: 0; } }
.tip { position: absolute; transform: translate(12px, 12px); padding: 3px 8px; background: var(--ink); border: 1px solid var(--line-strong); border-radius: 2px; font-family: var(--f-type); font-size: 12px; pointer-events: none; opacity: 0; white-space: nowrap; }
.tip.on { opacity: 1; }

/* ---- title ---- */
.at-title .hud, .at-title .party, .at-title .card { display: none; }
.title { position: absolute; inset: 0; display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 400px); gap: clamp(20px, 4vw, 56px); align-items: end; padding: 6vh clamp(16px, 5vw, 64px) 8vh; background: linear-gradient(90deg, rgba(4, 5, 9, 0.75) 0%, rgba(4, 5, 9, 0.2) 55%, rgba(4, 5, 9, 0.6) 100%); overflow: auto; }
.title h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(52px, 9vw, 120px); line-height: 0.95; letter-spacing: 0.02em; margin: 0 0 16px; text-shadow: 0 2px 40px rgba(193, 36, 47, 0.6); }
.title h1 span { color: var(--blood); }
.tag { font-size: clamp(18px, 2.1vw, 22px); font-style: italic; max-width: 30ch; margin: 0 0 12px; }
.tagsub { color: var(--paper-dim); max-width: 44ch; margin: 0; }
.panel { background: var(--ink); border: 1px solid var(--line); border-radius: 4px; backdrop-filter: blur(6px); }
.begin { padding: 18px; display: grid; gap: 12px; }
.begin label.f { display: grid; gap: 4px; font-family: var(--f-type); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--paper-faint); }
.begin input[type="text"] { font: inherit; font-size: 17px; color: var(--paper); background: rgba(0, 0, 0, 0.4); border: 1px solid var(--line-strong); border-radius: 3px; padding: 8px 10px; width: 100%; letter-spacing: 0; text-transform: none; }
.choices { display: grid; gap: 5px; border: 0; margin: 0; padding: 0; min-width: 0; }
.choices legend { font-family: var(--f-type); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--paper-faint); padding: 0; margin-bottom: 4px; }
.choice { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 9px; padding: 7px 9px; border: 1px solid var(--line); border-radius: 3px; background: var(--raise); cursor: pointer; }
.choice:has(input:checked) { border-color: var(--paper); background: rgba(235, 226, 209, 0.1); }
.choice input { accent-color: var(--blood); margin: 4px 0 0; }
.choice b { font-weight: 600; font-size: 15px; }
.choice small { display: block; font-size: 12.5px; color: var(--paper-dim); line-height: 1.35; }
.foot { grid-column: 1 / -1; font-family: var(--f-type); font-size: 11px; color: var(--paper-faint); margin: 0; }
.fatal { position: absolute; inset: 0; display: grid; place-content: center; padding: 24px; text-align: center; gap: 8px; }
.fatal h2 { font-family: var(--f-display); font-weight: 400; font-size: 30px; margin: 0; }
.fatal p { color: var(--paper-dim); max-width: 52ch; margin: 0 auto; }

/* ---- dialogue: captions over the speaker, roll readout, notice marker ---- */
#ui > .speech-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.bubble { position: absolute; left: 0; top: 0; width: max-content; max-width: min(370px, calc(100vw - 24px)); min-width: 168px; padding: 9px 14px 8px; background: rgba(9, 8, 12, 0.92); border: 1px solid var(--edge, var(--line-strong)); border-radius: 3px; box-shadow: 0 12px 38px rgba(0, 0, 0, 0.65); opacity: 0; transform: translateY(6px); transition: opacity 0.18s, transform 0.18s; --edge: rgba(235, 226, 209, 0.34); }
.bubble.on { opacity: 1; transform: none; }
.bubble::after { content: ""; position: absolute; left: var(--tail, 50%); bottom: -7px; width: 12px; height: 12px; margin-left: -6px; background: rgba(9, 8, 12, 0.98); border-right: 1px solid var(--edge); border-bottom: 1px solid var(--edge); transform: rotate(45deg); }
.bubble.flip::after { bottom: auto; top: -7px; transform: rotate(225deg); }
.b-name { font-family: var(--f-type); font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--paper-dim); }
.k-stranger .b-name { color: var(--ember); }
.k-npc .b-name { color: #d8c48a; }
.b-text { font-family: var(--f-body); font-size: 18px; line-height: 1.38; margin-top: 2px; text-wrap: pretty; }
.b-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 5px; }
.b-dots { display: flex; gap: 4px; }
.b-dots i { width: 5px; height: 5px; border-radius: 50%; background: rgba(235, 226, 209, 0.2); }
.b-dots i.done { background: rgba(235, 226, 209, 0.5); }
.b-dots i.on { background: var(--ember); }
.b-hint { font-family: var(--f-type); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--paper-faint); transition: opacity 0.2s; }
.bubble.on .b-hint { animation: nudge 1.4s ease-in-out infinite; }
@keyframes nudge { 50% { color: var(--paper-dim); } }
